name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Test, Lint & Build (JVM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Robolectric 4.16.x requires Java 21+ to run its SDK 36 (Android 16)
          # sandbox — DefaultSdkProvider.verifySupportedSdk throws
          # "Android SDK 36 requires Java 21" on JDK 17.
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew test

      - name: Android lint
        run: ./gradlew lint

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/outputs/apk/debug/*.apk
